# Тема: файл из job A не оказывается в job B сам по себе.
# Upload/Download Artifact — перенос результата и скачивание его с вкладки Actions.
name: '06 — Artifacts between jobs'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Сформировать отчёт
        run: python scripts/create_report.py
      - name: Сохранить артефакт в GitHub
        uses: actions/upload-artifact@v7
        with:
          name: lesson-report
          path: dist/report.txt
          if-no-files-found: error
          retention-days: 7

  consume-artifact:
    needs: create-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Скачать артефакт из предыдущей job
        uses: actions/download-artifact@v8
        with:
          name: lesson-report
          path: received
      - name: Показать содержимое
        run: |
          ls -l received/
          cat received/report.txt
